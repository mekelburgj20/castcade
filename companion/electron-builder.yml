# electron-builder configuration for the Castcade companion (Windows x64, per-user NSIS).
# Run from companion/: `npm run dist:win` (local), `npm run release:win` (publishes to GitHub Releases).
# Unsigned for the PoC: no certificate config here on purpose (see README "Packaging").
appId: app.arcaid.castcade
productName: Castcade
copyright: GPL-3.0-only
directories:
  output: release
  buildResources: build
# The companion is an npm workspace: dependencies are hoisted to the monorepo root node_modules.
# electron-builder 26 resolves them from there via `npm list`; we never rebuild natives (there are none).
npmRebuild: false
asar: true
files:
  - dist/**
  - package.json
  - build/icon.png
  - build/tray.ico
  - "!dist/.tsbuildinfo"
  - "!dist/**/*.map"
  - "!dist/**/*.d.ts"
  - "!dist/**/*.d.ts.map"
extraResources:
  # The pinmame-nvram-maps corpus (ODbL), fetched by `npm run fetch-maps -w companion` before packaging.
  - from: resources/maps
    to: maps
  # The compact VPS index (ids, names, authors, versions, features only), built by `npm run fetch-vps -w companion`.
  - from: resources/vps
    to: vps
  # ffmpeg + ffplay for streaming, recording and the framing preview (D1.6): Gyan's GPLv3 essentials build, pinned by
  # version + sha256 in scripts/fetch-ffmpeg.mjs, fetched by `npm run fetch-ffmpeg -w companion`. Outside the asar so
  # the executables can run; src/media/ffmpeg-path.ts finds them at resources/ffmpeg. SOURCE-OFFER.txt (the GPLv3 written
  # offer, E5) is written there by fetch-ffmpeg and ships with them; the source itself is docs/ffmpeg-source.md.
  - from: resources/ffmpeg
    to: ffmpeg
  # The OpenVR overlay helper (D7): castcade-vr-overlay.exe + openvr_api.dll (BSD-3) + THIRD-PARTY.md, the zip the
  # vr-overlay workflow attaches to a release, fetched by `npm run fetch-vr-overlay -w companion` (release tag pinned in
  # scripts/fetch-vr-overlay.mjs). Outside the asar so the exe can run; src/media/vr-overlay.ts finds it here.
  - from: resources/vr-overlay
    to: vr-overlay
  # The shared VBScript library the patcher installs into <VPX>\scripts\ (vpx-hook/castcade.vbs at the repo
  # root; its Castcade_LibVersion must equal LIB_VERSION in src/patcher/render.ts). Packaged: resources/hook/castcade.vbs.
  - from: ../vpx-hook/castcade.vbs
    to: hook/castcade.vbs
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  artifactName: Castcade-Setup-${version}.${ext}
  signAndEditExecutable: true
  verifyUpdateCodeSignature: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: false
  deleteAppDataOnUninstall: false
  shortcutName: Castcade
publish:
  provider: github
  owner: mekelburgj20
  repo: castcade
  releaseType: release
