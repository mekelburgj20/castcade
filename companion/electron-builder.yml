# electron-builder configuration for the Castcade companion (Windows x64, per-user NSIS).
# Run from companion/: `npm run dist:win` (local), `npm run release:win` (publishes to GitHub Releases).
# Unsigned for the PoC: no certificate config here on purpose (see README "Packaging").
appId: app.arcaid.castcade
productName: Castcade
copyright: GPL-3.0-only
directories:
  output: release
  buildResources: build
# The companion is an npm workspace: dependencies are hoisted to the monorepo root node_modules.
# electron-builder 26 resolves them from there via `npm list`; we never rebuild natives (there are none).
npmRebuild: false
asar: true
files:
  - dist/**
  - package.json
  - build/icon.png
  - build/tray.ico
  - "!dist/.tsbuildinfo"
  - "!dist/**/*.map"
  - "!dist/**/*.d.ts"
  - "!dist/**/*.d.ts.map"
extraResources:
  # The pinmame-nvram-maps corpus (ODbL), fetched by `npm run fetch-maps -w companion` before packaging.
  - from: resources/maps
    to: maps
  # The compact VPS index (ids, names, authors, versions, features only), built by `npm run fetch-vps -w companion`.
  - from: resources/vps
    to: vps
  # ffmpeg + ffplay for streaming, recording and the framing preview (D1.6): Gyan's GPLv3 essentials build, pinned by
  # version + sha256 in scripts/fetch-ffmpeg.mjs, fetched by `npm run fetch-ffmpeg -w companion`. Outside the asar so
  # the executables can run; src/media/ffmpeg-path.ts finds them at resources/ffmpeg. SOURCE-OFFER.txt (the GPLv3 written
  # offer, E5) is written there by fetch-ffmpeg and ships with them; the source itself is docs/ffmpeg-source.md.
  - from: resources/ffmpeg
    to: ffmpeg
  # The OpenVR overlay helper (D7): castcade-vr-overlay.exe + openvr_api.dll (BSD-3) + THIRD-PARTY.md, the zip the
  # vr-overlay workflow attaches to a release, fetched by `npm run fetch-vr-overlay -w companion` (release tag pinned in
  # scripts/fetch-vr-overlay.mjs). Outside the asar so the exe can run; src/media/vr-overlay.ts finds it here.
  - from: resources/vr-overlay
    to: vr-overlay
  # The OpenXR panel layer (D7.3): XrApiLayer_castcade_panel.dll + its manifest .json + THIRD-PARTY.md, the zip the
  # vr-layer workflow attaches to a release (release.yml builds it from the tag), fetched by `npm run fetch-vr-layer -w
  # companion`. Outside the asar: the OpenXR loader inside VPX reads the json and loads the dll from this folder, which
  # src/media/vr-layer.ts registers under HKCU\SOFTWARE\Khronos\OpenXR\1\ApiLayers\Implicit.
  - from: resources/vr-layer
    to: vr-layer
  # The table-sound helper (D2.8): castcade-audio.exe, which mutes this rig's VPX while another player is up and taps
  # its sound while this rig is up (audio-helper/README.md). release.yml builds it from the tag; locally `npm run
  # fetch-audio-helper -w companion` (or `-- --from audio-helper/build/Release`). Outside the asar so the exe can run;
  # src/media/audio-helper.ts finds it here, and treats a missing one as "table sound unavailable".
  - from: resources/audio-helper
    to: audio-helper
  # The native spectator-video helper (D10.1): castcade-video.exe (libwebrtc + FFmpeg, docs/design/spectator-video-native.md
  # §6.2) with the FFmpeg DLLs beside it (LGPL/GPL, see docs/ffmpeg-source.md) and THIRD-PARTY.md. release.yml builds it from
  # the tag; locally `npm run fetch-video-helper -w companion` (or `-- --from video-helper/build/Release`). Outside the
  # asar so the exe can run; a missing one means the native video path is unavailable.
  - from: resources/video-helper
    to: video-helper
  # The shared VBScript library the patcher installs into <VPX>\scripts\ (vpx-hook/castcade.vbs at the repo
  # root; its Castcade_LibVersion must equal LIB_VERSION in src/patcher/render.ts). Packaged: resources/hook/castcade.vbs.
  - from: ../vpx-hook/castcade.vbs
    to: hook/castcade.vbs
# A14: the join link, castcade://join/<invite> (src/main/deep-link.ts). electron-builder 26 reads `protocols` for the
# macOS, Linux and AppX targets only; its NSIS templates write no URL-protocol keys (checked in
# app-builder-lib/templates/nsis and out/targets). On Windows the keys come from build/installer.nsh at install time
# and from the app itself at every start (`app.setAsDefaultProtocolClient`), both under HKCU.
protocols:
  - name: Castcade match link
    schemes:
      - castcade
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  artifactName: Castcade-Setup-${version}.${ext}
  signAndEditExecutable: true
  verifyUpdateCodeSignature: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: false
  deleteAppDataOnUninstall: false
  shortcutName: Castcade
  # Windows Firewall rule for the video helper (D10.1); best-effort, see the file for the elevation finding.
  include: build/installer.nsh
publish:
  provider: github
  owner: mekelburgj20
  repo: castcade
  releaseType: release
