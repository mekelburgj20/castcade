name: VR overlay helper (Windows x64)

# castcade-vr-overlay.exe (D7; vr-overlay/README.md): the build of record for the C++ helper.
# Push or PR touching vr-overlay/** (or this file) → build, upload the artifact castcade-vr-overlay-win-x64.
# Tag push `v*` → also zip it as castcade-vr-overlay-<tag>-win-x64.zip on that GitHub release, where
# companion/scripts/fetch-vr-overlay.mjs fetches it for packaging. (Path filters do not apply to tag pushes.)
on:
  push:
    branches: ['**']
    tags: ['v*']
    paths:
      - 'vr-overlay/**'
      - '.github/workflows/vr-overlay.yml'
  pull_request:
    paths:
      - 'vr-overlay/**'
      - '.github/workflows/vr-overlay.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vr-overlay-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: castcade-vr-overlay (windows x64, MSVC, Release)
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      # The default generator on the runner is its newest Visual Studio; OpenVR comes from the pinned tag (sha256-checked).
      - name: Configure
        run: cmake -S vr-overlay -B vr-overlay/build -A x64
      - name: Build (Release)
        run: cmake --build vr-overlay/build --config Release
      - name: The shippable set is all there
        shell: bash
        run: |
          set -euo pipefail
          cd vr-overlay/build/Release
          ls -l castcade-vr-overlay.exe openvr_api.dll THIRD-PARTY.md
      - name: Upload the helper as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: castcade-vr-overlay-win-x64
          if-no-files-found: error
          path: |
            vr-overlay/build/Release/castcade-vr-overlay.exe
            vr-overlay/build/Release/openvr_api.dll
            vr-overlay/build/Release/THIRD-PARTY.md
      - name: Zip for the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $files = 'castcade-vr-overlay.exe', 'openvr_api.dll', 'THIRD-PARTY.md' | ForEach-Object { Join-Path vr-overlay/build/Release $_ }
          Compress-Archive -Path $files -DestinationPath "castcade-vr-overlay-$env:GITHUB_REF_NAME-win-x64.zip"
          (Get-FileHash "castcade-vr-overlay-$env:GITHUB_REF_NAME-win-x64.zip" -Algorithm SHA256).Hash.ToLower()
      # release.yml creates the same pre-release on the same tag; whichever workflow gets there first creates it, the
      # other finds it (a lost create race is fine: the view after it must then succeed).
      - name: Attach the zip to the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --prerelease --title "Castcade $GITHUB_REF_NAME" --notes "See docs/phase-2-witness.md for the tester guide. Unsigned proof of concept." || gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release upload "$GITHUB_REF_NAME" "castcade-vr-overlay-$GITHUB_REF_NAME-win-x64.zip" --clobber --repo "$GITHUB_REPOSITORY"
