name: Release (Windows installer)

# Tag push `v*` → build, publish to the GitHub Release (electron-updater's latest.yml included).
# workflow_dispatch → build only; the installer is attached to the run as a workflow artifact.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Castcade-Setup (windows x64, nsis, unsigned)
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch the pinmame-nvram-maps corpus into companion/resources/maps
        run: npm run fetch-maps -w companion
      - name: Build the compact VPS index into companion/resources/vps
        run: npm run fetch-vps -w companion
      - name: Fetch the pinned ffmpeg build (sha256-checked) into companion/resources/ffmpeg
        run: npm run fetch-ffmpeg -w companion
      # D7: the installer carries the OpenVR overlay helper built from THIS tag (vr-overlay.yml builds the same thing in
      # parallel for the release's zip; a tag cannot fetch its own zip, so the release job builds it here too).
      - name: Build the VR overlay helper and stage it into companion/resources/vr-overlay
        shell: bash
        run: |
          set -euo pipefail
          cmake -S vr-overlay -B vr-overlay/build -A x64
          cmake --build vr-overlay/build --config Release
          node companion/scripts/fetch-vr-overlay.mjs --from vr-overlay/build/Release
      - run: npm run build
      - name: Create the pre-release first (electron-builder's parallel uploads race to create it otherwise)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --prerelease --title "Castcade $GITHUB_REF_NAME" --notes "See docs/phase-2-witness.md for the tester guide. Unsigned proof of concept."
      - name: Package (publish to the release on tag pushes only)
        working-directory: companion
        run: npx electron-builder --win --publish ${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }}
      # GPLv3 section 6(d) (E5): the Corresponding Source of the bundled ffmpeg rides on the same release. continue-on-error
      # because a source-upload failure must not block a release; the written offer in docs/ffmpeg-source.md still
      # stands, and the owner re-runs this step.
      - name: Publish the GPL Corresponding Source for the bundled ffmpeg
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        shell: bash
        run: |
          npm run ffmpeg-source -w companion
          gh release upload "$GITHUB_REF_NAME" companion/release/ffmpeg-*-source.tar.gz companion/release/ffmpeg-*-SOURCES.txt --clobber --repo "$GITHUB_REPOSITORY"
      - name: Upload installer as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: Castcade-Setup-windows-x64
          if-no-files-found: error
          path: |
            companion/release/*.exe
            companion/release/*.exe.blockmap
            companion/release/latest.yml
