name: Release (Windows installer)

# Tag push `v*` → build, publish to the GitHub Release (electron-updater's latest.yml included).
# workflow_dispatch → build only; the installer is attached to the run as a workflow artifact.
# E10: two installers from the same tag: the full app (job `windows`, latest.yml) and the Witness edition (job
# `witness`, electron-builder.witness.yml: no native helpers, its own update file witness.yml, never a latest.yml).
# The full job creates the release; job `witness-publish` adds the Witness files once both builds have succeeded.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Castcade-Setup (windows x64, nsis, unsigned)
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch the pinmame-nvram-maps corpus into companion/resources/maps
        run: npm run fetch-maps -w companion
      - name: Build the compact VPS index into companion/resources/vps
        run: npm run fetch-vps -w companion
      - name: Fetch the pinned ffmpeg build (sha256-checked) into companion/resources/ffmpeg
        run: npm run fetch-ffmpeg -w companion
      # D7: the installer carries the OpenVR overlay helper built from THIS tag (vr-overlay.yml builds the same thing in
      # parallel for the release's zip; a tag cannot fetch its own zip, so the release job builds it here too).
      - name: Build the VR overlay helper and stage it into companion/resources/vr-overlay
        shell: bash
        run: |
          set -euo pipefail
          cmake -S vr-overlay -B vr-overlay/build -A x64
          cmake --build vr-overlay/build --config Release
          node companion/scripts/fetch-vr-overlay.mjs --from vr-overlay/build/Release
      # D7.3: the same for the OpenXR layer (vr-layer.yml builds the release's zip in parallel).
      - name: Build the OpenXR panel layer and stage it into companion/resources/vr-layer
        shell: bash
        run: |
          set -euo pipefail
          # D7.3.3: the build id on the layer's "loaded in" log line: the tag on tag pushes, else the short sha.
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then id="$GITHUB_REF_NAME"; else id="${GITHUB_SHA::7}"; fi
          cmake -S vr-layer -B vr-layer/build -A x64 -DCASTCADE_BUILD_ID="$id"
          cmake --build vr-layer/build --config Release
          node companion/scripts/fetch-vr-layer.mjs --from vr-layer/build/Release
      # D2.8: the same for the table-sound helper (audio-helper.yml builds the release's zip in parallel).
      - name: Build the table-sound helper and stage it into companion/resources/audio-helper
        shell: bash
        run: |
          set -euo pipefail
          cmake -S audio-helper -B audio-helper/build -A x64
          cmake --build audio-helper/build --config Release
          node companion/scripts/fetch-audio-helper.mjs --from audio-helper/build/Release
      # D10.1: the native spectator-video helper (video-helper.yml builds the release's zip in parallel). Fetches its deps
      # (libwebrtc, FFmpeg shared build; sha256-pinned), builds, and stages exe + FFmpeg dlls + THIRD-PARTY.md.
      # E11: the dated BtbN autobuild the helper pins is gone upstream (HTTP 404 on 2026-11-20; the first v0.2.47 run
      # failed here). Its files live in the Actions cache video-helper.yml keeps on main: same path and key, so the same
      # archive. fetch-ffmpeg.mjs checks the folder against the sha256 pin and downloads only on a miss.
      - name: Restore the video helper's pinned FFmpeg from the cache video-helper.yml keeps
        uses: actions/cache/restore@v4
        with:
          path: video-helper/deps/ffmpeg
          key: video-ffmpeg-${{ runner.os }}-${{ hashFiles('video-helper/ffmpeg.sha256') }}
      - name: Build the native video helper and stage it into companion/resources/video-helper
        shell: bash
        run: |
          set -euo pipefail
          pwsh video-helper/fetch-webrtc.ps1
          node video-helper/fetch-ffmpeg.mjs
          cmake -S video-helper -B video-helper/build -A x64
          cmake --build video-helper/build --config Release
          node companion/scripts/fetch-video-helper.mjs --from video-helper/build/Release
      - run: npm run build
      # C16.2: the packaged app's own smoke, the only proof that the journal pipe's worker loads from inside app.asar (CI's
      # smoke runs the unpacked dev layout). It runs on the app folder alone (`--dir`), before the release exists and before
      # anything is published: a build whose worker does not load fails here and reaches nobody (a release created and left
      # without its installer would break every installed app's update check). Castcade.exe is a GUI-subsystem program:
      # Start-Process -Wait is what makes the step wait for it and get its exit code and output. Fails on a non-zero exit
      # or without `journal-pipe ok`. The Package step below builds the app folder again with the installer.
      - name: Package the app folder only (not published)
        working-directory: companion
        run: npx electron-builder --win --dir --publish never
      - name: Smoke the packaged app (Castcade.exe --smoke, the journal pipe's worker inside the asar)
        shell: pwsh
        timeout-minutes: 3
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'castcade-smoke.out'
          $err = Join-Path $env:RUNNER_TEMP 'castcade-smoke.err'
          $p = Start-Process -FilePath companion\release\win-unpacked\Castcade.exe -ArgumentList '--smoke' -Wait -PassThru -NoNewWindow -RedirectStandardOutput $out -RedirectStandardError $err
          $text = (Get-Content -Raw $out) ?? ''
          Write-Output $text
          Get-Content -Raw $err
          if ($p.ExitCode -ne 0) { throw "Castcade.exe --smoke exited with $($p.ExitCode)" }
          if ($text -notmatch 'journal-pipe ok') { throw 'Castcade.exe --smoke did not print journal-pipe ok' }
      - name: Create the pre-release first (electron-builder's parallel uploads race to create it otherwise)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --prerelease --title "Castcade $GITHUB_REF_NAME" --notes "See docs/phase-2-witness.md for the tester guide. Unsigned proof of concept."
      - name: Package (publish to the release on tag pushes only)
        working-directory: companion
        run: npx electron-builder --win --publish ${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }}
      # GPLv3 section 6(d) (E5): the Corresponding Source of the bundled ffmpeg rides on the same release. continue-on-error
      # because a source-upload failure must not block a release; the written offer in docs/ffmpeg-source.md still
      # stands, and the owner re-runs this step.
      - name: Publish the GPL Corresponding Source for the bundled ffmpeg
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        shell: bash
        run: |
          npm run ffmpeg-source -w companion
          gh release upload "$GITHUB_REF_NAME" companion/release/ffmpeg-*-source.tar.gz companion/release/ffmpeg-*-SOURCES.txt --clobber --repo "$GITHUB_REPOSITORY"
      - name: Upload installer as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: Castcade-Setup-windows-x64
          if-no-files-found: error
          path: |
            companion/release/*.exe
            companion/release/*.exe.blockmap
            companion/release/latest.yml

  # E10: the Witness edition (cabinets): the Arcaid Witness part only, maps + VPS index + hook library, no native helper
  # (so no cmake here) and no ffmpeg. Its update file is witness.yml (`publish.channel: witness`); installed Witness
  # editions ask each release for it, and refuse the latest.yml the updater falls back to when a release has none.
  witness:
    name: Castcade-Witness-Setup (windows x64, nsis, unsigned)
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch the pinmame-nvram-maps corpus into companion/resources/maps
        run: npm run fetch-maps -w companion
      - name: Build the compact VPS index into companion/resources/vps
        run: npm run fetch-vps -w companion
      - run: npm run build
      # The same check as the full job's, before anything is published: the packaged app's --smoke (journal pipe worker
      # inside the asar) and the edition baked into it.
      - name: Package the app folder only (not published)
        working-directory: companion
        run: npx electron-builder --win --dir --config electron-builder.witness.yml --publish never
      - name: Smoke the packaged app (Castcade.exe --smoke, edition witness)
        shell: pwsh
        timeout-minutes: 3
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'castcade-smoke.out'
          $err = Join-Path $env:RUNNER_TEMP 'castcade-smoke.err'
          $p = Start-Process -FilePath companion\release\win-unpacked\Castcade.exe -ArgumentList '--smoke' -Wait -PassThru -NoNewWindow -RedirectStandardOutput $out -RedirectStandardError $err
          $text = (Get-Content -Raw $out) ?? ''
          Write-Output $text
          Get-Content -Raw $err
          if ($p.ExitCode -ne 0) { throw "Castcade.exe --smoke exited with $($p.ExitCode)" }
          if ($text -notmatch 'journal-pipe ok') { throw 'Castcade.exe --smoke did not print journal-pipe ok' }
          if ($text -notmatch 'edition witness') { throw 'Castcade.exe --smoke did not print edition witness' }
      # Built with --publish never and uploaded by name below: the three files go up, and nothing else (never a latest.yml,
      # which would turn every full install into a Witness edition at its next update check).
      - name: Package
        working-directory: companion
        run: npx electron-builder --win --config electron-builder.witness.yml --publish never
      - name: Check the update file (witness.yml names the Witness installer; no latest.yml)
        shell: bash
        run: |
          set -euo pipefail
          test -f companion/release/witness.yml
          grep -q 'Castcade-Witness-Setup-' companion/release/witness.yml
          if grep -q 'Castcade-Setup-' companion/release/witness.yml; then echo 'witness.yml names the full installer'; exit 1; fi
          if [ -e companion/release/latest.yml ]; then echo 'the Witness build wrote a latest.yml'; exit 1; fi
      - name: Upload installer as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: Castcade-Witness-Setup-windows-x64
          if-no-files-found: error
          path: |
            companion/release/Castcade-Witness-Setup-*.exe
            companion/release/Castcade-Witness-Setup-*.exe.blockmap
            companion/release/witness.yml

  # E10: the Witness files go onto the release only after the full job has put its own there. A release that holds
  # witness.yml but not yet latest.yml would answer every full install's update check with a 404, and for good if the
  # full job then failed. The other way round is safe: without witness.yml a Witness install is offered latest.yml,
  # refuses it (the edition guard in main/updater.ts) and stays as it is.
  witness-publish:
    name: Publish the Witness installer to the release (tag pushes only)
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, witness]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: Castcade-Witness-Setup-windows-x64
          path: witness
      - name: Upload the installer, its blockmap and witness.yml (never a latest.yml)
        shell: bash
        run: |
          set -euo pipefail
          ls -la witness
          if [ -e witness/latest.yml ]; then echo 'the Witness artifact holds a latest.yml'; exit 1; fi
          gh release upload "$GITHUB_REF_NAME" --clobber --repo "$GITHUB_REPOSITORY"             witness/Castcade-Witness-Setup-*.exe             witness/Castcade-Witness-Setup-*.exe.blockmap             witness/witness.yml
      # Last, so that a failure here leaves a complete release. Whichever tag workflow creates the release writes one
      # generic line; this replaces it once both installers are there.
      - name: Say on the release page which installer is which
        shell: bash
        run: |
          set -euo pipefail
          v="${GITHUB_REF_NAME#v}"
          {
            echo "Two installers; pick one. Either installs over the other and keeps your pairing."
            echo
            echo "- **Castcade-Setup-$v.exe**: the full app (Arcaid Witness scoring, matches, voice, VR streaming)."
            echo "- **Castcade-Witness-Setup-$v.exe**: the Witness alone, for cabinets and tournament scoring."
            echo
            echo "Guides: docs/tester-kit.md, and docs/tester-kit-cabinet.md for a cabinet. Unsigned proof of concept."
          } > notes.md
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
