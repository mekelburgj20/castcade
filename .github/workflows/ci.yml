name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, build, test (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test
      - name: Generated protocol files are current
        run: npm run generate -w protocol -- --check

  windows:
    name: build, test, electron smoke (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test
      - name: Electron smoke (prints version and quits before any window)
        run: npx electron companion --smoke

  fixtures:
    name: fixture replay (detector)
    runs-on: ubuntu-latest
    env:
      MAPS_COMMIT: f16a0cc6c347370706bf1a3f2c7a77568b3f69e7
      NVPARSER_COMMIT: 00ea7847545c9edd84613db99c7dd54976ddf568
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Fetch pinned pinmame-nvram-maps and py-pinmame-nvmaps
        shell: bash
        run: |
          set -euo pipefail
          fetch() {
            local url="$1" sha="$2" dir="$3"
            git init -q "$dir"
            git -C "$dir" remote add origin "$url"
            git -C "$dir" fetch -q --depth 1 origin "$sha"
            git -C "$dir" checkout -q FETCH_HEAD
          }
          fetch https://github.com/tomlogic/pinmame-nvram-maps "$MAPS_COMMIT" "$RUNNER_TEMP/pinmame-nvram-maps"
          fetch https://github.com/tomlogic/py-pinmame-nvmaps "$NVPARSER_COMMIT" "$RUNNER_TEMP/py-pinmame-nvmaps"
      - name: Replay fixtures through the detector
        env:
          CASTCADE_MAPS: ${{ runner.temp }}/pinmame-nvram-maps
          CASTCADE_NVPARSER: ${{ runner.temp }}/py-pinmame-nvmaps
        run: python fixtures/check.py
